<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vyšehrad · A little world above Prague</title>
    <meta
      name="description"
      content="Explore Prague's Vyšehrad in an original, open-data 3D browser playground."
    />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/welcome-fortress.jpg"
      imagesrcset="%BASE_URL%images/welcome-fortress.jpg 1200w, %BASE_URL%images/welcome-fortress-large.jpg 3840w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root">
      <img
        src="%BASE_URL%images/welcome-fortress.jpg"
        srcset="
          %BASE_URL%images/welcome-fortress.jpg       1200w,
          %BASE_URL%images/welcome-fortress-large.jpg 3840w
        "
        sizes="100vw"
        alt=""
        aria-hidden="true"
        width="1200"
        height="750"
        fetchpriority="high"
        style="
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        "
      />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
