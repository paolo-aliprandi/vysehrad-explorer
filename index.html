<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vyšehrad · A little world above Prague</title>
    <meta
      name="description"
      content="Explore Prague's Vyšehrad in an original, open-data 3D browser playground."
    />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/welcome-fortress.jpg"
      imagesrcset="%BASE_URL%images/welcome-fortress.jpg 1200w, %BASE_URL%images/welcome-fortress-large.jpg 3840w"
      imagesizes="100vw"
      media="(min-width: 800.01px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/welcome-fortress.jpg"
      media="(max-width: 800px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root">
      <picture>
        <source
          media="(max-width: 800px)"
          srcset="%BASE_URL%images/welcome-fortress.jpg"
        />
        <img
          src="%BASE_URL%images/welcome-fortress.jpg"
          srcset="
            %BASE_URL%images/welcome-fortress.jpg       1200w,
            %BASE_URL%images/welcome-fortress-large.jpg 3840w
          "
          sizes="100vw"
          alt=""
          aria-hidden="true"
          width="1200"
          height="750"
          fetchpriority="high"
          style="
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
          "
        />
      </picture>
      <p
        role="status"
        style="
          position: fixed;
          bottom: 24px;
          left: 24px;
          padding: 12px 18px;
          border-radius: 12px;
          background: #f3efe2;
          color: #43584c;
        "
      >
        Preparing Vyšehrad…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
