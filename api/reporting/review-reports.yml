name: Deliver private visitor reports
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: private-report-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_API_URL: ${{ vars.REPORT_API_URL }}
      REPORT_REVIEW_KEY: ${{ secrets.REPORT_REVIEW_KEY }}
    steps:
      - name: Create issues from the private queue
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base=process.env.REPORT_API_URL;
          const repo=process.env.GITHUB_REPOSITORY;
          const github=async(path,method='GET',body)=>{
            const response=await fetch('https://api.github.com'+path,{
              method,
              headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              body:body===undefined?undefined:JSON.stringify(body),
              signal:AbortSignal.timeout(20000),
            });
            if(!response.ok)throw Error('GitHub request failed: '+response.status);
            return response.json();
          };
          const service=async(path,method='GET',body)=>{
            const response=await fetch(new URL(path,base),{
              method,
              headers:{Authorization:'Bearer '+process.env.REPORT_REVIEW_KEY,'Content-Type':'application/json'},
              body:body===undefined?undefined:JSON.stringify(body),
              signal:AbortSignal.timeout(20000),
            });
            if(!response.ok)throw Error('Report queue request failed: '+response.status);
            return response.json();
          };
          if((await github('/repos/'+repo)).private!==true)throw Error('The review repository must remain private.');
          const {reports}=await service('/internal/reports');
          for(const report of reports){
            const marker='Report ID: `'+report.id+'`';
            const query=new URLSearchParams({q:'repo:'+repo+' "'+report.id+'" in:body'});
            const existing=await github('/search/issues?'+query);
            let issue=existing.items.find(issue=>issue.body?.includes(marker));
            issue??=await github('/repos/'+repo+'/issues','POST',{title:report.title,body:report.body});
            await service('/internal/ack','POST',{id:report.id,issue:issue.number});
            console.log('Delivered private report '+report.id+' as issue #'+issue.number);
          }
          console.log('Private report delivery complete: '+reports.length);
          JS
